      ref: main

dependency_overrides:
  flutter_inappwebview_windows:
    git:
      url: https://github.com/bggRGjQaUbCoE/flutter_inappwebview.git
      path: flutter_inappwebview_windows
      ref: v6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: assets/images/logo/logo_2.png
  windows:
    generate: true
    image_path: assets/images/logo/logo_2.png
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - path: assets/images/
    - path: assets/images/logo/
    - path: assets/images/logo/ico/
      platforms: [windows]
    - path: assets/images/live/
    - path: assets/images/paycoins/
    - path: assets/js/
      platforms: [windows]

  fonts:
    - family: digital_id_num
      fonts:
        - asset: assets/fonts/digital_id_num.ttf
    - family: custom_icon
      fonts:
        - asset: assets/fonts/custom_icon.ttf
