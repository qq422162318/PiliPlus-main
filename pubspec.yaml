      path: packages/chat_bottom_container
      ref: dev
  collection: ^1.19.1
  connectivity_plus: ^7.1.1
  cookie_jar: ^4.0.8
  crypto: ^3.0.6
  cupertino_ui: ^1.0.0
  dio: ^5.9.1
